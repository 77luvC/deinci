# Date-stamped pipeline parameters. Copy this file for each new run date, then
# change only the parameters that define that run.

run:
  name: field_scan_200_2026-07-27
  project_dir: ..
  python: python

openalex:
  mailto: null
  api_key_env: OPENALEX_API_KEY
  sleep_seconds: 0.15

sampling:
  language: en
  seeds_per_period: 200
  candidate_sample_size: 3000
  min_references: 8
  random_seed: 42

historical_citations:
  method: yearly
  max_retries: 3
  checkpoint_every: 100

core_metrics:
  low_citation_quantile: 0.25
  relevance_threshold: 0.80
  use_relevance_scores_when_available: true

relevance_scoring:
  enabled: true
  model: malteos/scincl
  # Set true (or pass --force-recompute / FORCE_RECOMPUTE=1) to ignore cached
  # embeddings/pair scores and recompute even when inputs haven't changed.
  force_recompute: false

steps:
  build_raw: true
  load_pairs: true
  pair_metadata: true
  historical_metadata: true
  relevance_scoring: true
  historical_scores: true
  cited_distribution: true
  democratization: true
  temporal_relevance: true
  aggregate_core: true
  plot_core: true
  cross_field_did: false

fields:
  - dataset: openalex_cs_200
    label: CS
    field_id: "17"
  - dataset: openalex_health_informatics_200
    label: Health Informatics
    subfield_ids: "2718"
  - dataset: openalex_public_health_200
    label: Public Health
    subfield_ids: "2739"
  - dataset: openalex_psychology_200
    label: Psychology
    field_id: "32"
  - dataset: openalex_social_sciences_200
    label: Social Sciences
    field_id: "33"

did:
  # Folder name only (nested under results/<run-id>/aggregate/tables/), not a
  # path from the project root -- DID output is per-run like everything else.
  output_dir: did_democratization
  treatment_field_label: CS
  control_field_labels:
    - Health Informatics
    - Public Health
    - Psychology
    - Social Sciences
