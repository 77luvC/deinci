# Pure Math large-sample run: 1000 seed papers per AI-era period (2000 total),
# matching the cs_1000 and health_informatics_1000 runs' scale. Kept as its own
# config (rather than editing pipeline_2026-07-27.yaml) so this larger sample
# doesn't change the other field-scan datasets, and so `dataset` reflects the
# actual sample size instead of the misleading `_200` suffix.

run:
  name: pure_math_1000_2026-07-27
  project_dir: ..
  python: python

openalex:
  mailto: ran0925@bu.edu
  api_key_env: OPENALEX_API_KEY
  sleep_seconds: 0.15

sampling:
  language: en
  seeds_per_period: 1000
  # Bumped from the 3000 default for headroom: usable candidates (needs an
  # abstract + >= min_references) are a subset of the raw sample, and 1000
  # seeds/period leaves less margin per citation-stratum quota than 200 did.
  candidate_sample_size: 5000
  min_references: 8
  random_seed: 42

historical_citations:
  method: yearly
  max_retries: 3
  checkpoint_every: 100

core_metrics:
  low_citation_quantile: 0.25
  relevance_threshold: 0.80
  use_relevance_scores_when_available: true

relevance_scoring:
  enabled: true
  model: malteos/scincl
  force_recompute: false

steps:
  build_raw: true
  load_pairs: true
  pair_metadata: true
  historical_metadata: true
  relevance_scoring: true
  historical_scores: true
  cited_distribution: true
  democratization: true
  temporal_relevance: true
  aggregate_core: true
  plot_core: true
  cross_field_did: false

fields:
  - dataset: openalex_pure_math_1000
    label: Pure Math
    subfield_ids: "2602|2607|2608"
    seeds_per_period: 1000
