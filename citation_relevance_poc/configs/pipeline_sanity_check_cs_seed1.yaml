# Throwaway sanity-check config: seed_per_period=1, CS only. Used to smoke-test
# the pipeline end to end (including SciNCL relevance scoring) with a tiny,
# fast run. Not a real experiment — dataset/run names are marked "sanity" so
# outputs never collide with the real field-scan 200-seed runs.

run:
  name: sanity_check_cs_seed1
  project_dir: ..
  python: python

openalex:
  mailto: ran0925@bu.edu
  api_key_env: OPENALEX_API_KEY
  sleep_seconds: 0.15

sampling:
  language: en
  seeds_per_period: 1
  candidate_sample_size: 50
  min_references: 8
  random_seed: 42

historical_citations:
  method: yearly
  max_retries: 3
  checkpoint_every: 100

core_metrics:
  low_citation_quantile: 0.25
  relevance_threshold: 0.80
  use_relevance_scores_when_available: true

relevance_scoring:
  enabled: true
  model: malteos/scincl
  force_recompute: false

steps:
  build_raw: true
  load_pairs: true
  pair_metadata: true
  historical_metadata: true
  relevance_scoring: true
  historical_scores: true
  cited_distribution: true
  democratization: true
  temporal_relevance: true
  aggregate_core: true
  plot_core: true
  cross_field_did: false

fields:
  - dataset: openalex_cs_sanity1
    label: CS
    field_id: "17"
