# Combined CS + Health Informatics + Pure Math comparison at the
# 1000-seeds/period scale. All three datasets' raw/processed data already
# exist (built by pipeline_cs_1000_2026-07-27.yaml,
# pipeline_health_informatics_1000_2026-07-27.yaml, and
# pipeline_pure_math_1000_2026-07-27.yaml respectively); this config is
# intended to be run with `--skip build_raw` so it reuses that data and just
# recombines it into one aggregate_core/plot_core output covering all three
# fields.

run:
  name: cs_health_puremath_1000_2026-07-27
  project_dir: ..
  python: python

openalex:
  mailto: ran0925@bu.edu
  api_key_env: OPENALEX_API_KEY
  sleep_seconds: 0.15

sampling:
  language: en
  seeds_per_period: 1000
  candidate_sample_size: 5000
  min_references: 8
  random_seed: 42

historical_citations:
  method: yearly
  max_retries: 3
  checkpoint_every: 100

core_metrics:
  low_citation_quantile: 0.25
  relevance_threshold: 0.80
  use_relevance_scores_when_available: true

relevance_scoring:
  enabled: true
  model: malteos/scincl
  force_recompute: false

steps:
  build_raw: true
  load_pairs: true
  pair_metadata: true
  historical_metadata: true
  relevance_scoring: true
  historical_scores: true
  cited_distribution: true
  democratization: true
  temporal_relevance: true
  aggregate_core: true
  plot_core: true
  cross_field_did: false

fields:
  - dataset: openalex_cs_1000
    label: CS
    field_id: "17"
  - dataset: openalex_health_informatics_1000
    label: Health Informatics
    subfield_ids: "2718"
  - dataset: openalex_pure_math_1000
    label: Pure Math
    subfield_ids: "2602|2607|2608"
